<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0809 账号工作台</title>
  <style>
    :root { --ink:#171717; --muted:#6f6f6b; --line:#ddddda; --line-strong:#c8c8c3; --paper:#fff; --surface:#f4f4f1; --soft:#fafaf8; --ok:#27613e; --ok-bg:#f1f8f3; --ok-line:#9cc4aa; --error:#9d3535; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:var(--surface); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    button { font:inherit; }
    button:disabled { cursor:wait; opacity:.55; }
    button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
    main { width:min(1260px,calc(100% - 48px)); margin:0 auto; padding:42px 0 72px; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:26px; align-items:start; margin-top:8px; }
    .layout__main { min-width:0; }
    .layout__side { min-width:0; position:sticky; top:24px; padding-top:18px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:28px; padding:0 2px 22px; border-bottom:1px solid var(--line-strong); }
    h1 { margin:0; font-size:24px; line-height:1.2; font-weight:720; letter-spacing:-.02em; }
    header p { margin:5px 0 0; color:var(--muted); font-size:13px; }
    .page-note { color:var(--muted); font-size:12px; white-space:nowrap; }
    #accounts { padding-top:20px; }
    #accounts > .account { max-width:780px; }
    .account-tabs { display:flex; flex-wrap:wrap; gap:8px; padding:18px 2px 0; }
    .account-tab { appearance:none; min-width:0; display:inline-flex; align-items:center; gap:7px; max-width:280px; padding:8px 14px; border:1px solid var(--line-strong); border-radius:999px; background:var(--paper); color:var(--muted); font-size:13px; line-height:1.2; cursor:pointer; transition:background-color 160ms ease,color 160ms ease,border-color 160ms ease; }
    .account-tab:hover { border-color:var(--ink); color:var(--ink); }
    .account-tab[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:var(--paper); }
    .account-tab__code { flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--soft); color:var(--muted); font-size:11px; font-weight:640; }
    .account-tab[aria-selected="true"] .account-tab__code { background:rgba(255,255,255,.16); color:var(--paper); }
    .account-tab__label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .account { min-width:0; overflow:hidden; display:flex; flex-direction:column; border:1px solid var(--line-strong); border-radius:7px; background:var(--paper); box-shadow:0 1px 0 rgba(0,0,0,.02); }
    .account__identity { min-width:0; padding:17px 18px 15px; }
    .account__eyebrow { display:flex; align-items:center; gap:7px; margin-bottom:5px; color:var(--muted); font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
    .account__dot { width:7px; height:7px; flex:none; border-radius:50%; background:#5b8b69; box-shadow:0 0 0 3px #edf5ef; }
    .account__name { margin:0; max-width:100%; font-size:17px; line-height:1.35; font-weight:690; overflow-wrap:anywhere; word-break:break-word; }
    .account__user { margin-top:3px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; word-break:break-word; }
    .account__checkin-reward { display:inline-flex; align-items:baseline; gap:6px; max-width:100%; margin-top:10px; padding:4px 8px; border:1px solid var(--line); border-radius:999px; background:var(--soft); color:var(--muted); font-size:11px; line-height:1.35; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .account__checkin-reward strong { color:var(--ink); font-size:12px; font-weight:680; white-space:nowrap; }
    .account__checkin-reward--ok { border-color:var(--ok-line); background:var(--ok-bg); color:var(--ok); }
    .account__checkin-reward--ok strong { color:var(--ok); }
    .account__checkin-reward--error { border-color:#d7b0b0; background:#fdf3f3; color:var(--error); }
    .account__actions { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; padding:12px 14px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--soft); }
    .action { min-width:0; height:36px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 9px; border:1px solid #bdbdb8; border-radius:5px; background:var(--paper); color:var(--ink); font-size:12px; line-height:1; white-space:nowrap; cursor:pointer; transition:background-color 160ms ease,color 160ms ease,border-color 160ms ease; }
    .action svg { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .action:hover:not(:disabled) { border-color:var(--ink); background:#f0f0ed; }
    .action--primary { border-color:var(--ink); background:var(--ink); color:var(--paper); }
    .action--primary:hover:not(:disabled) { background:#303030; color:var(--paper); }
    .action--done,
    .action--done:disabled { border-color:var(--ok-line); color:var(--ok); background:var(--ok-bg); cursor:default; opacity:1; }
    .auto-draw { padding:13px 18px 15px; border-bottom:1px solid var(--line); background:#fcfcfa; }
    .auto-draw__head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:11px; }
    .auto-draw__title { margin:0; color:var(--muted); font-size:12px; font-weight:540; }
    .auto-draw__summary { color:#8b8b86; font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .auto-draw__timeline { position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0; padding:0; list-style:none; }
    .auto-draw__timeline::before { content:""; position:absolute; top:6px; right:calc(16.666% + 4px); left:calc(16.666% + 4px); height:1px; background:var(--line-strong); }
    .auto-draw__step { position:relative; z-index:1; min-width:0; }
    .auto-draw__dot { width:13px; height:13px; margin-bottom:6px; border:3px solid var(--paper); border-radius:50%; background:#b9b9b4; box-shadow:0 0 0 1px var(--line-strong); }
    .auto-draw__step--running .auto-draw__dot { background:var(--ink); box-shadow:0 0 0 1px var(--ink),0 0 0 4px #ececea; }
    .auto-draw__step--completed .auto-draw__dot { background:#4e8a61; box-shadow:0 0 0 1px #4e8a61; }
    .auto-draw__step--skipped .auto-draw__dot { background:#8b8b86; box-shadow:0 0 0 1px #8b8b86; }
    .auto-draw__step--failed .auto-draw__dot { background:var(--error); box-shadow:0 0 0 1px var(--error); }
    .auto-draw__time { color:var(--ink); font-size:11px; font-weight:640; font-variant-numeric:tabular-nums; }
    .auto-draw__status { min-width:0; margin-top:2px; color:var(--muted); font-size:11px; line-height:1.35; overflow-wrap:anywhere; }
    .auto-draw__step--completed .auto-draw__status { color:var(--ok); }
    .auto-draw__step--failed .auto-draw__status { color:var(--error); }
    .auto-draw__error { margin-top:7px; color:var(--error); font-size:11px; }
    .auto-draw__empty { margin:0; padding:2px 0 8px; color:var(--muted); font-size:11px; }
    .auto-draw__form { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; }
    .auto-draw__form .sched-kind, .auto-draw__form .sched-start, .auto-draw__form .sched-end { font:inherit; font-size:12px; padding:5px 7px; border:1px solid var(--line-strong); border-radius:5px; background:var(--paper); color:var(--ink); }
    .auto-draw__step .action--compact { margin-top:4px; height:24px; font-size:10px; padding:0 8px; }
    .balance-section { padding-bottom:18px; }
    .account__body { flex:1; padding:17px 18px 16px; }
    .draw-section { padding-bottom:18px; }
    .section-head { min-width:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 14px; margin-bottom:10px; }
    .section-title { margin:0; color:var(--muted); font-size:12px; font-weight:540; }
    .section-meta { min-width:0; color:#8b8b86; font-size:11px; text-align:right; overflow-wrap:anywhere; }
    .metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:#fbfbfa; }
    .metric { min-width:0; padding:12px 13px 11px; border-right:1px solid var(--line); }
    .metric:last-child { border-right:0; }
    .metric__label { color:var(--muted); font-size:11px; }
    .metric__value { margin-top:2px; font-size:18px; line-height:1.2; font-weight:690; font-variant-numeric:tabular-nums; }
    .metric__unit { margin-left:2px; color:var(--muted); font-size:11px; font-weight:450; }
    .draw-empty { min-height:74px; display:flex; align-items:center; padding:0 13px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:#fbfbfa; color:var(--muted); }
    .activity-section { padding-bottom:18px; }
    .activity-toolbar { display:inline-flex; align-items:center; gap:6px; }
    .activity-note { margin-top:10px; color:var(--muted); font-size:12px; }
    .activity-note--error { color:var(--error); }
    .purchase-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
    .action--purchase { min-height:42px; height:auto; padding:10px 12px; white-space:normal; text-align:center; line-height:1.35; }
    .action--compact { height:30px; padding:0 10px; font-size:11px; }
    .subscriptions { padding-top:1px; }
    .subscription { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; padding:13px 0; border-bottom:1px solid #ebebe8; }
    .subscription:last-child { border-bottom:0; }
    .subscription__plan { font-size:13px; font-weight:620; }
    .subscription__meta { margin-top:2px; color:var(--muted); font-size:11px; }
    .subscription__quota { text-align:right; font-size:15px; font-weight:650; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .empty { color:var(--muted); }
    .account__footer { min-height:42px; display:flex; align-items:center; gap:8px; padding:10px 18px; border-top:1px solid var(--line); background:#fcfdfc; }
    .account__footer svg { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .account__footer:focus-visible { outline:2px solid var(--ink); outline-offset:-3px; }
    .account__status { color:var(--muted); font-size:12px; }
    .account__status--ok { color:var(--ok); }
    .account__status--error { color:var(--error); }
    .page-message { grid-column:1 / -1; padding:24px 0; color:var(--muted); }
    .auth-badge { display:inline-flex; align-items:center; margin-left:8px; padding:1px 8px; border:1px solid var(--line); border-radius:999px; background:var(--soft); color:var(--muted); font-size:11px; }
    .auth-badge--ok { border-color:var(--ok-line); background:var(--ok-bg); color:var(--ok); }
    .auth-badge--error { border-color:#d7b0b0; background:#fdf3f3; color:var(--error); }
    .account__manage { display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px 12px; border-bottom:1px solid var(--line); background:#fcfcfa; }
    .action--danger { color:var(--error); border-color:#d7b0b0; }
    .action--danger:hover:not(:disabled) { border-color:var(--error); background:#fdf3f3; }
    .account-dialog { border:1px solid var(--line-strong); border-radius:8px; padding:0; min-width:300px; max-width:92vw; }
    .account-dialog::backdrop { background:rgba(23,23,23,.35); }
    .account-dialog form { padding:18px; display:grid; gap:10px; }
    .account-dialog h3 { margin:0; font-size:16px; }
    .account-dialog label { display:grid; gap:4px; color:var(--muted); font-size:12px; }
    .account-dialog input { font:inherit; padding:8px 10px; border:1px solid var(--line-strong); border-radius:5px; }
    .account-dialog .dialog-error { color:var(--error); font-size:12px; min-height:16px; margin:0; }
    .account-dialog__row { display:flex; gap:8px; justify-content:flex-end; }
    .preview-state { color:var(--muted); font-size:13px; margin-bottom:8px; }
    .preview-dialog ul { margin:0; padding-left:18px; color:var(--ink); font-size:13px; }
    .preview-sessions { list-style:none; margin:0 0 12px; padding:0; display:grid; gap:6px; }
    .preview-sessions li { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
    .sess-sid { font-variant-numeric:tabular-nums; color:var(--ink); }
    .sess-badge { display:inline-flex; padding:1px 8px; border:1px solid var(--line); border-radius:999px; background:var(--soft); font-size:11px; }
    .sess-badge--danger { border-color:#d7b0b0; background:#fdf3f3; color:var(--error); }
    .account__user { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .runtime-panel { border:1px solid var(--line-strong); border-radius:7px; background:var(--paper); box-shadow:0 1px 0 rgba(0,0,0,.02); overflow:hidden; }
    .runtime-panel__header { min-width:0; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:18px; border-bottom:1px solid var(--line); background:var(--soft); }
    .runtime-panel__title { margin:0; font-size:16px; line-height:1.3; font-weight:690; }
    .runtime-panel__description { margin:4px 0 0; color:var(--muted); font-size:12px; }
    .runtime-list { min-width:0; }
    .runtime-state { padding:18px; color:var(--muted); }
    .runtime-state--error { color:var(--error); }
    .runtime-log { padding:14px 18px 15px; border-bottom:1px solid #ebebe8; }
    .runtime-log:last-child { border-bottom:0; }
    .runtime-log__top { min-width:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; }
    .runtime-log__time { font-size:13px; font-weight:620; font-variant-numeric:tabular-nums; }
    .runtime-log__status { display:inline-flex; align-items:center; min-height:24px; padding:0 8px; border:1px solid var(--line); border-radius:999px; background:#f7f7f5; color:var(--muted); font-size:11px; letter-spacing:.02em; }
    .runtime-log__status--ok { border-color:var(--ok-line); background:var(--ok-bg); color:var(--ok); }
    .runtime-log__status--error { border-color:#d7b0b0; background:#fdf3f3; color:var(--error); }
    .runtime-log__meta { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:7px; color:var(--muted); font-size:12px; }
    .runtime-log__message { margin-top:8px; color:var(--ink); overflow-wrap:anywhere; word-break:break-word; }
    @media (max-width:1040px) {
      main { width:min(760px,calc(100% - 36px)); }
      .layout { grid-template-columns:1fr; gap:22px; }
      .layout__side { position:static; padding-top:0; }
    }
    @media (max-width:620px) {
      main { width:min(100% - 24px,520px); padding-top:26px; }
      header { align-items:flex-start; flex-direction:column; gap:8px; }
      .page-note { white-space:normal; }
      .account__actions { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .action--primary { grid-column:span 2; }
      .metrics { grid-template-columns:repeat(3,minmax(84px,1fr)); }
      .section-meta { width:100%; text-align:left; }
      .runtime-panel__header { flex-direction:column; align-items:stretch; }
    }
    @media (max-width:390px) {
      .purchase-actions { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>0809 账号工作台</h1><p>每个账号独立管理与查询。认证材料仅在服务端状态文件中使用。</p></div><div class="page-note">额度统一以美元显示</div></header>
    <div class="layout">
      <div class="layout__main">
        <nav class="account-tabs" id="account-tabs" aria-label="账号切换"></nav>
        <section id="accounts" aria-label="账号详情"><p class="page-message">正在读取账号...</p></section>
      </div>
      <aside class="layout__side">
        <section class="runtime-panel" aria-labelledby="runtime-logs-title">
          <div class="runtime-panel__header">
            <div><h2 id="runtime-logs-title" class="runtime-panel__title">系统运行日志</h2><p class="runtime-panel__description">自动抽奖执行结果，最新优先展示。</p></div>
            <button id="runtime-logs-refresh" class="action action--compact" type="button">刷新日志</button>
          </div>
          <div id="runtime-logs" class="runtime-list" aria-live="polite" aria-busy="true"><div class="runtime-state">正在读取运行日志...</div></div>
        </section>
      </aside>
    </div>
  </main>
  <dialog id="account-dialog" class="account-dialog">
    <form>
      <h3 id="account-dialog-title">新增账号</h3>
      <label>显示名<input id="account-dialog-label" name="label" maxlength="64" required></label>
      <label>登录名<input id="account-dialog-login" name="login_name" autocomplete="off"></label>
      <label>密码<input id="account-dialog-password" name="password" type="password" autocomplete="new-password"></label>
      <p class="dialog-error" id="account-dialog-error"></p>
      <div class="account-dialog__row"><button type="button" class="action" id="account-dialog-cancel">取消</button><button type="submit" class="action action--primary">保存</button></div>
    </form>
  </dialog>
  <dialog id="reauth-dialog" class="account-dialog">
    <form>
      <h3>重新认证</h3>
      <p>账号：<strong id="reauth-dialog-account"></strong></p>
      <p class="preview-state">将使用保存的密码向平台发起一次新的登录，可能占用一个平台会话名额。远端会话清理不可用时，请确认当前平台的会话数量仍有余量。</p>
      <label><input type="checkbox" id="reauth-dialog-confirm" required>我确认要立即重新认证</label>
      <p class="dialog-error" id="reauth-dialog-error"></p>
      <div class="account-dialog__row"><button type="button" class="action" id="reauth-dialog-cancel">取消</button><button type="submit" class="action action--primary">重新认证</button></div>
    </form>
  </dialog>
  <dialog id="preview-dialog" class="account-dialog">
    <form>
      <h3>远端会话清理</h3>
      <div id="preview-dialog-body"></div>
      <div class="account-dialog__row"><button type="button" class="action" id="preview-dialog-close">关闭</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog" class="account-dialog">
    <form>
      <h3>删除账号</h3>
      <p>账号：<strong id="delete-dialog-account"></strong></p>
      <p class="preview-state">将删除本地凭据、业务快照与计划，且不可恢复。该账号在平台上的会话不会被清理。</p>
      <label><input type="checkbox" id="delete-dialog-confirm" required>我确认删除该账号及其本地数据</label>
      <p class="dialog-error" id="delete-dialog-error"></p>
      <div class="account-dialog__row"><button type="button" class="action" id="delete-dialog-cancel">取消</button><button type="submit" class="action action--danger">删除</button></div>
    </form>
  </dialog>
  <script>
    const state = { accounts: [], activeAccountId: null, runtimeLogs: [], logsLoading: false, logsError: '', autoDrawLoading: false };
    const root = document.querySelector('#accounts');
    const tabsRoot = document.querySelector('#account-tabs');
    const logsRoot = document.querySelector('#runtime-logs');
    const logsRefreshButton = document.querySelector('#runtime-logs-refresh');
    const icons = {
      checkin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="m9 16 2 2 4-4"/></svg>',
      claim: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12v8H4v-8M2 7h20v5H2zM12 22V7M12 7H7.5A2.5 2.5 0 1 1 10 4.5C10 7 12 7 12 7ZM12 7h4.5A2.5 2.5 0 1 0 14 4.5C14 7 12 7 12 7Z"/></svg>',
      draw: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-1.7 3.5L6.5 8.2l3.8 1.7L12 13.5l1.7-3.6 3.8-1.7-3.8-1.7L12 3ZM5 15l-.9 1.9L2 18l2.1 1.1L5 21l.9-1.9L8 18l-2.1-1.1L5 15ZM18.5 14l-1.2 2.5L15 17.7l2.3 1.1 1.2 2.5 1.2-2.5 2.3-1.1-2.3-1.2-1.2-2.5Z"/></svg>',
      refresh: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>',
      subscriptions: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 16l4-4 3 3 5-6"/></svg>',
      success: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 10A10 10 0 1 1 17 3.3"/><path d="m9 11 3 3L22 4"/></svg>',
      error: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
      info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
      edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',

      const label = document.querySelector('#account-dialog-label').value.trim();
      const loginName = document.querySelector('#account-dialog-login').value.trim();
      const password = document.querySelector('#account-dialog-password').value;
      const errorNode = document.querySelector('#account-dialog-error');
      errorNode.textContent = '';
      try {
        if (editTargetId) {
          const payload = { label };
          if (loginName) payload.login_name = loginName;
          if (password) payload.password = password;
          await request(`/api/accounts/${encodeURIComponent(editTargetId)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        } else {
          await request('/api/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ label, login_name: loginName, password }) });
        }
        document.querySelector('#account-dialog-password').value = '';
        closeDialog(accountDialog);
        await loadAccounts();
      } catch (error) {
        errorNode.textContent = error.message;
      }
    }
    async function submitReauthenticate(accountID) {
      const errorNode = document.querySelector('#reauth-dialog-error');
      errorNode.textContent = '';
      try {
        await request(`/api/accounts/${encodeURIComponent(accountID)}/reauthenticate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true }) });
        closeDialog(reauthDialog);
        await loadAccounts();
      } catch (error) {
        errorNode.textContent = error.message;
      }
    }
    async function submitDelete(accountID) {
      const errorNode = document.querySelector('#delete-dialog-error');
      errorNode.textContent = '';
      try {
        await request(`/api/accounts/${encodeURIComponent(accountID)}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirmation: 'DELETE' }) });
        closeDialog(deleteDialog);
        if (state.activeAccountId === accountID) state.activeAccountId = null;
        await loadAccounts();
      } catch (error) {
        errorNode.textContent = error.message;
      }
    }
    accountDialog.addEventListener('submit', submitAccountDialog);
    document.querySelector('#account-dialog-cancel').addEventListener('click', () => { document.querySelector('#account-dialog-password').value = ''; closeDialog(accountDialog); });
    reauthDialog.addEventListener('submit', (event) => { event.preventDefault(); submitReauthenticate(reauthDialog.dataset.accountId); });
    document.querySelector('#reauth-dialog-cancel').addEventListener('click', () => closeDialog(reauthDialog));
    deleteDialog.addEventListener('submit', (event) => { event.preventDefault(); submitDelete(deleteDialog.dataset.accountId); });
    document.querySelector('#delete-dialog-cancel').addEventListener('click', () => closeDialog(deleteDialog));
    document.querySelector('#preview-dialog-close').addEventListener('click', () => closeDialog(previewDialog));
    previewDialog.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-session-cleanup]');
      if (!button) return;
      const accountID = previewDialog.dataset.accountId;
      const errorNode = document.querySelector('#preview-dialog-error');
      errorNode.textContent = '';
      button.disabled = true;
      try {
        const result = await request(`/api/accounts/${encodeURIComponent(accountID)}/sessions/cleanup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true }) });
        errorNode.textContent = `已撤销 ${result.revoked.length} 个会话${result.failed.length ? `，失败 ${result.failed.length} 个` : ''}`;
        const payload = await request(`/api/accounts/${encodeURIComponent(accountID)}/session-preview`);
        document.querySelector('#preview-dialog-body').innerHTML = renderSessionPreview(payload.preview);
      } catch (error) {
        errorNode.textContent = error.message;
        button.disabled = false;
      }
    });
    function handleManagementAction(button) {
      if (button.hasAttribute('data-add-account')) { openAccountDialog(null); return; }
      const accountID = button.dataset.editAccount || button.dataset.validateAuth || button.dataset.reauthenticate || button.dataset.sessionPreview || button.dataset.deleteAccount;
      if (!accountID) return;
      const account = findAccount(accountID);
      if (button.dataset.editAccount) openAccountDialog(account);
      else if (button.dataset.validateAuth) request(`/api/accounts/${encodeURIComponent(accountID)}/validate`, { method: 'POST' }).then(async (result) => { account.auth_health = result.auth_health; render(); }).catch(async (error) => { setFooter(account, `认证检查失败：${error.message}`, 'error'); render(); });
      else if (button.dataset.reauthenticate) { reauthDialog.dataset.accountId = accountID; document.querySelector('#reauth-dialog-account').textContent = account?.label || accountID; document.querySelector('#reauth-dialog-error').textContent = ''; openDialog(reauthDialog); }
      else if (button.dataset.sessionPreview) { previewDialog.dataset.accountId = accountID; document.querySelector('#preview-dialog-body').innerHTML = '<div class="preview-state">正在读取会话列表...</div>'; document.querySelector('#preview-dialog-error').textContent = ''; openDialog(previewDialog); request(`/api/accounts/${encodeURIComponent(accountID)}/session-preview`).then((payload) => { document.querySelector('#preview-dialog-body').innerHTML = renderSessionPreview(payload.preview); }).catch((error) => { closeDialog(previewDialog); setFooter(account, `会话预览失败：${error.message}`, 'error'); render(); }); }
      else if (button.dataset.deleteAccount) { deleteDialog.dataset.accountId = accountID; document.querySelector('#delete-dialog-account').textContent = account?.label || accountID; document.querySelector('#delete-dialog-error').textContent = ''; openDialog(deleteDialog); }
    }
    tabsRoot.addEventListener('click', (event) => {
      const add = event.target.closest('[data-add-account]');
      if (add) { openAccountDialog(null); return; }
      const tab = event.target.closest('[data-tab]');
      if (!tab) return;
      const id = tab.dataset.tab;
      if (id === state.activeAccountId) { tab.focus({ preventScroll: true }); return; }
      state.activeAccountId = id;
      render();
      tabsRoot.querySelector('.account-tab[aria-selected="true"]')?.focus({ preventScroll: true });
    });
    async function loadAccounts() {
      const payload = await request('/api/accounts');
      const previous = state.activeAccountId;
      state.accounts = Array.isArray(payload?.accounts) ? payload.accounts.map(hydrateAccount) : [];
      state.activeAccountId = state.accounts.some((item) => item.id === previous) ? previous : (state.accounts[0]?.id || null);
      render();
      return refreshAutoDrawStatus();
    }
    renderRuntimeLogs();
    loadAccounts().catch((error) => {
      root.innerHTML = `<p class="page-message">${escapeHTML(error.message)}</p>`;
    });
    loadRuntimeLogs();
    window.setInterval(() => {
      if (document.visibilityState === 'hidden') return;
      refreshAutoDrawStatus();
      loadRuntimeLogs();
    }, 30000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        refreshAutoDrawStatus();
        loadRuntimeLogs();
      }
    });
  </script>
</body>
</html>
