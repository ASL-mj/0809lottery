<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    :root { --ink:#171717; --muted:#6f6f6b; --line:#ddddda; --line-strong:#c8c8c3; --paper:#fff; --surface:#f4f4f1; --soft:#fafaf8; --ok:#27613e; --ok-bg:#f1f8f3; --ok-line:#9cc4aa; --error:#9d3535; --error-bg:#fdf3f3; --error-line:#d7b0b0; --warn:#8a5a12; --warn-bg:#fdf6ec; --warn-line:#e0c48c; --list-max:280px; }

    main { width:min(1260px,calc(100% - 48px)); margin:0 auto; padding:42px 0 72px; }

    .header-actions { display:flex; align-items:center; justify-content:flex-end; gap:12px; }

    .auto-draw__time { color:var(--ink); font-size:11px; font-weight:640; font-variant-numeric:tabular-nums; }
    .auto-draw__status { min-width:0; margin-top:2px; color:var(--muted); font-size:11px; line-height:1.35; overflow-wrap:anywhere; }

    .auto-draw__empty { margin:0; padding:2px 0 8px; color:var(--muted); font-size:11px; }

    .metrics-groups { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; align-items:start; }
    .metric-group { min-width:0; padding:13px 13px 14px; border:1px solid var(--line); border-radius:6px; background:var(--paper); }

    .status-line__text { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .status-line__reward { flex:none; display:inline-flex; align-items:center; padding:2px 7px; border:1px solid var(--ok-line); border-radius:999px; background:var(--ok-bg); color:var(--ok); font-size:10px; font-weight:650; white-space:nowrap; }
    .status-line__link { margin-left:auto; flex:none; color:var(--ink); font-weight:650; }
    .details { padding:11px 14px 13px; }
    .details-split { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.8fr) minmax(0,1fr); gap:10px; }
    .details-column { min-width:0; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fcfcfa; }
    .details__title { margin:0 0 8px; color:var(--muted); font-size:11px; font-weight:650; }
    .plan-column-head, .subscription-column-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .plan-column-head .details__title, .subscription-column-head .details__title { margin-bottom:0; }
    .plan-settings, .subscription-refresh { flex:none; height:26px; display:inline-flex; align-items:center; gap:4px; padding:0 8px; border:1px solid var(--line-strong); border-radius:5px; background:var(--paper); color:var(--muted); font-size:10px; cursor:pointer; }
    .plan-settings { border-color:var(--ink); background:var(--ink); color:var(--paper); }
    .plan-settings:hover:not(:disabled), .subscription-refresh:hover:not(:disabled) { border-color:var(--ink); color:var(--ink); background:#f0f0ed; }
    .plan-settings:hover:not(:disabled) { background:#303030; color:var(--paper); }
    .plan-settings svg, .subscription-refresh svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .plan-list, .subscription-list { display:grid; gap:6px; }
    .plan-row__note { display:block; margin-top:2px; color:var(--muted); font-size:10px; line-height:1.4; overflow-wrap:anywhere; }
    .plan-list { margin:0; padding:0; list-style:none; max-height:var(--list-max); overflow-y:auto; padding-right:2px; }
    .plan-row, .subscription-item { min-width:0; display:grid; grid-template-columns:minmax(0,1fr) auto auto auto; gap:8px; align-items:center; padding:8px 9px; border:1px solid var(--line); border-radius:5px; background:var(--paper); }
    .plan-row__main { min-width:0; }
    .plan-row__mode { display:block; margin-top:2px; color:#8b8b86; font-size:9px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .plan-row__time { display:block; min-width:0; color:var(--ink); font-size:11px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .plan-row__status { color:var(--ok); font-size:10px; font-weight:650; white-space:nowrap; }
    .plan-row__status--pending { color:#8b5d24; }
    .plan-row__task { color:var(--muted); font-size:10px; white-space:nowrap; }
    .task-switch { position:relative; display:inline-flex; align-items:center; width:34px; height:20px; padding:0; border:0; border-radius:999px; background:#c5c5c0; cursor:pointer; transition:background-color 160ms ease; }
    .task-switch::after { content:""; width:16px; height:16px; margin-left:2px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.18); transition:transform 160ms ease; }
    .task-switch[aria-checked="true"] { background:#4e8a61; }
    .task-switch[aria-checked="true"]::after { transform:translateX(14px); }
    .task-switch:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
    .subscription-item { grid-template-columns:minmax(0,1fr) auto; }
    .subscription-item__name { min-width:0; color:var(--ink); font-size:11px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .subscription-item__meta { margin-top:2px; color:#8b8b86; font-size:9px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .subscription-item__quota { color:var(--ink); font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
    .subscription-item__quota span { display:block; margin-top:2px; color:#8b8b86; font-size:9px; font-weight:450; }
    .draw-history-list { display:grid; gap:6px; max-height:var(--list-max); overflow-y:auto; padding-right:2px; }
    .draw-history-item { min-width:0; padding:8px 9px; border:1px solid var(--line); border-radius:5px; background:var(--paper); }
    .draw-history-item__head { display:flex; align-items:center; gap:6px; min-width:0; }
    .draw-history-item__source { color:var(--muted); font-size:9px; font-weight:550; white-space:nowrap; }
    .draw-history-item__title { min-width:0; color:var(--ink); font-size:11px; font-weight:680; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .draw-history-item__time { min-width:0; color:#8b8b86; font-size:9px; white-space:nowrap; }
    .draw-history-item__status { margin-left:auto; flex:none; color:var(--muted); font-size:10px; font-weight:650; white-space:nowrap; }
    .draw-history-item__status--ok { color:var(--ok); }
    .draw-history-item__status--error { color:var(--error); }
    .draw-history-item__detail { margin-top:3px; color:var(--ink); font-size:9px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .draw-history-item__meta { display:flex; flex-wrap:wrap; gap:3px 8px; margin-top:3px; color:#8b8b86; font-size:9px; line-height:1.25; }
    .draw-history-item__meta span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .auto-draw { padding:0; border:0; background:transparent; }
    .auto-draw__head { margin:0; }
    .auto-draw__title { display:none; }
    .auto-draw__summary { color:var(--muted); font-size:11px; }
    .auto-draw__timeline { display:none; }
    .auto-draw__empty { margin:0 0 8px; color:var(--muted); font-size:11px; }
    .auto-draw__error { margin-top:7px; color:var(--error); font-size:11px; }
    .auto-draw__step { list-style:none; }
    .auto-draw__dot { display:none; }
    .auto-draw__time, .auto-draw__status { font-size:11px; }
    .auto-draw__step .action--compact { margin-top:0; height:24px; font-size:10px; }
    .account__body > .details { margin-top:0; }
    .account__body { padding:0; }
    @media (max-width:1040px) {
      main { width:min(760px,calc(100% - 36px)); }
      .layout { grid-template-columns:1fr; gap:22px; }
      .layout__side { position:static; padding-top:0; }

    @media (max-width:620px) {
      main { width:min(100% - 24px,520px); padding-top:26px; }

      .header-actions { width:100%; justify-content:space-between; }
      .page-note { white-space:normal; }
      .account__actions { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .action--primary { grid-column:span 2; }
      .metrics-groups { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .metrics { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .section-meta { width:100%; text-align:left; }
      .runtime-panel__header { flex-direction:column; align-items:stretch; }
    .details-split { grid-template-columns:1fr; }
    }

      .metrics-groups { grid-template-columns:1fr; }
    }
    @media (max-width:390px) {
      .account__purchase-row { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }

<body>
  <main>
    <header><div><h1><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>星额台</h1><p>多账号额度、订阅与任务配置。</p></div><div class="header-actions"><div id="admin-logout-error" class="page-note" role="status" aria-live="polite"></div><div class="page-note">额度统一以美元显示</div><button id="admin-logout" class="action action--compact" type="button">退出登录</button></div></header>
    <div class="layout">
      <div class="layout__main">
        <nav class="account-tabs" id="account-tabs" aria-label="账号切换"></nav>
        <section id="accounts" aria-label="账号详情"><p class="page-message">正在读取账号...</p></section>
      </div>
      <aside class="layout__side">
        <section class="runtime-panel" aria-labelledby="runtime-logs-title">
          <div class="runtime-panel__header">
            <div><h2 id="runtime-logs-title" class="runtime-panel__title">系统运行日志</h2><p class="runtime-panel__description">抽奖执行结果，最新优先展示。</p></div>
            <button id="runtime-logs-refresh" class="action action--compact" type="button">刷新日志</button>
          </div>
          <div id="runtime-logs" class="runtime-list" aria-live="polite" aria-busy="true"><div class="runtime-state">正在读取运行日志...</div></div>
        </section>
      </aside>
    </div>
  </main>
  <dialog id="account-dialog" class="account-dialog">
    <form>
      <h3 id="account-dialog-title">新增账号</h3>
      <label>显示名<input id="account-dialog-label" name="label" maxlength="64" required></label>
      <label>登录名<input id="account-dialog-login" name="login_name" autocomplete="off"></label>
      <label>密码<input id="account-dialog-password" name="password" type="password" autocomplete="new-password"></label>
      <p class="dialog-error" id="account-dialog-error"></p>
      <div class="account-dialog__row"><button type="button" class="action" id="account-dialog-cancel">取消</button><button type="submit" class="action action--primary">保存</button></div>
    </form>
  </dialog>
  <dialog id="schedule-dialog" class="account-dialog schedule-dialog">
    <form>
      <h3>设置自动任务</h3>
      <p class="schedule-dialog__hint">账号：<strong id="schedule-dialog-account"></strong></p>
      <div class="schedule-dialog__fields">
        <label>任务类型<select id="schedule-dialog-task"><option value="draw">自动抽奖</option><option value="claim">领取每日抽奖次数</option><option value="checkin">自动签到（活跃度达标后执行）</option></select></label>
        <label>执行方式<select id="schedule-dialog-kind"><option value="fixed">固定时间</option><option value="random">时段随机</option></select></label>
        <label>开始时间<input id="schedule-dialog-start" type="time" required></label>
        <label id="schedule-dialog-end-label">结束时间<input id="schedule-dialog-end" type="time"></label>
      </div>
      <p class="schedule-dialog__hint" id="schedule-dialog-help">每天在指定时间执行一次。</p>
      <p class="dialog-error" id="schedule-dialog-error"></p>
      <div class="account-dialog__row"><button type="button" class="action" id="schedule-dialog-cancel">取消</button><button type="submit" class="action action--primary" id="schedule-dialog-submit">添加计划</button></div>
    </form>
  </dialog>
  <dialog id="reauth-dialog" class="account-dialog reauth-dialog">
    <form>
      <h3>重新认证</h3>
      <p class="reauth-dialog__account"><span>账号</span><strong id="reauth-dialog-account"></strong></p>
      <p class="reauth-dialog__warning">将使用保存的密码向平台发起一次新的登录，可能占用一个平台会话名额。远端会话清理不可用时，请确认当前平台的会话数量仍有余量。</p>
      <label class="reauth-dialog__confirm"><input type="checkbox" id="reauth-dialog-confirm" required><span>我确认要立即重新认证</span></label>
      <p class="dialog-error" id="reauth-dialog-error"></p>
      <div class="account-dialog__row"><button type="button" class="action" id="reauth-dialog-cancel">取消</button><button type="submit" class="action action--primary">重新认证</button></div>
    </form>
  </dialog>
  <dialog id="preview-dialog" class="account-dialog">
    <form>
      <h3>远端会话清理</h3>
      <div id="preview-dialog-body"></div>
      <p class="dialog-error" id="preview-dialog-error"></p>
      <div class="account-dialog__row"><button type="button" class="action" id="preview-dialog-close">关闭</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog" class="account-dialog">
    <form>
      <h3>删除账号</h3>
      <p>账号：<strong id="delete-dialog-account"></strong></p>
      <p class="preview-state">将删除本地凭据、业务快照与计划，且不可恢复。该账号在平台上的会话不会被清理。</p>
      <label><input type="checkbox" id="delete-dialog-confirm" required>我确认删除该账号及其本地数据</label>
      <p class="dialog-error" id="delete-dialog-error"></p>
      <div class="account-dialog__row"><button type="button" class="action" id="delete-dialog-cancel">取消</button><button type="submit" class="action action--danger">删除</button></div>
    </form>
  </dialog>
  <!-- Legacy API compatibility: draw-schedule remains supported by the server. -->
  <script>
    const state = { accounts: [], activeAccountId: null, runtimeLogs: [], logsLoading: false, logsError: '', autoDrawLoading: false };
    const root = document.querySelector('#accounts');
    const tabsRoot = document.querySelector('#account-tabs');
    const logsRoot = document.querySelector('#runtime-logs');
    const logsRefreshButton = document.querySelector('#runtime-logs-refresh');
    const logoutButton = document.querySelector('#admin-logout');
    const logoutError = document.querySelector('#admin-logout-error');
    const icons = {
      checkin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="m9 16 2 2 4-4"/></svg>',
      claim: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12v8H4v-8M2 7h20v5H2zM12 22V7M12 7H7.5A2.5 2.5 0 1 1 10 4.5C10 7 12 7 12 7ZM12 7h4.5A2.5 2.5 0 1 0 14 4.5C14 7 12 7 12 7Z"/></svg>',
      draw: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-1.7 3.5L6.5 8.2l3.8 1.7L12 13.5l1.7-3.6 3.8-1.7-3.8-1.7L12 3ZM5 15l-.9 1.9L2 18l2.1 1.1L5 21l.9-1.9L8 18l-2.1-1.1L5 15ZM18.5 14l-1.2 2.5L15 17.7l2.3 1.1 1.2 2.5 1.2-2.5 2.3-1.1-2.3-1.2-1.2-2.5Z"/></svg>',
      refresh: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>',
      subscriptions: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 16l4-4 3 3 5-6"/></svg>',
      success: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 10A10 10 0 1 1 17 3.3"/><path d="m9 11 3 3L22 4"/></svg>',
      error: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
      info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
      edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
      key: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>',
    };
    logsRefreshButton.innerHTML = `${icons.refresh}<span>刷新日志</span>`;
    const runtimeWindowLabels = {
      morning: '早间 08:00–09:00',
      noon: '午间 13:00–14:00',
      afternoon: '午间 13:00–14:00',
      midday: '午间 13:00–14:00',
      evening: '晚间 18:00–19:00',
      manual: '手动抽奖',
    };
    const autoDrawWindows = [
      { id: 'morning', time: '08:00–09:00' },
      { id: 'afternoon', time: '13:00–14:00' },
      { id: 'evening', time: '18:00–19:00' },
    ];
    const escapeHTML = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    const formatTime = (value) => {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime()) || date.getUTCFullYear() < 2000) return '';
      return new Intl.DateTimeFormat('zh-CN', { dateStyle:'medium', timeStyle:'short', hour12:false, timeZone:'Asia/Shanghai' }).format(date);
    };
    const formatRelativeTime = (value) => {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime()) || date.getUTCFullYear() < 2000) return '';
      const elapsedMinutes = Math.max(0, Math.floor((Date.now() - date.getTime()) / 60000));
      if (elapsedMinutes < 1) return '刚刚';
      if (elapsedMinutes < 60) return `${elapsedMinutes} 分钟前`;
      const elapsedHours = Math.floor(elapsedMinutes / 60);
      if (elapsedHours < 24) return `${elapsedHours} 小时前`;
      return `${Math.floor(elapsedHours / 24)} 天前`;
    };
    const formatClock = (value) => {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('zh-CN', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Shanghai' }).format(date);
    };
    const UNVERIFIED_MONEY_TEXT = '额度待确认（历史数据）';
    const UNAVAILABLE_MONEY_TEXT = '额度换算待确认';
    function formatMoney(money) {
      if (money == null) return UNAVAILABLE_MONEY_TEXT;
      if (money.state === 'confirmed' && money.display) return String(money.display);
      if (money.state === 'unverified') return UNVERIFIED_MONEY_TEXT;
      return UNAVAILABLE_MONEY_TEXT;
    }
    const formatQuota = (value) => formatMoney(value);
    const formatAward = (value) => formatMoney(value);
    const formatUSD = (value) => formatMoney(value);
    const toNumber = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
    function formatRuntimeStatus(status) {
      if (status === 'success' || status === 'completed') return { label: '成功', tone: 'ok' };
      if (status === 'skipped' || status === 'skip') return { label: '跳过', tone: 'muted' };
      if (status === 'failed' || status === 'failure' || status === 'error') return { label: '失败', tone: 'error' };
      return { label: status ? escapeHTML(status) : '未知', tone: 'muted' };
    }
    function formatRuntimeWindow(windowID) {
      return runtimeWindowLabels[windowID] || escapeHTML(windowID || '未知窗口');
    }
    function compareRuntimeLogs(left, right) {
      const leftTime = Date.parse(left?.occurred_at || '') || 0;
      const rightTime = Date.parse(right?.occurred_at || '') || 0;
      if (leftTime !== rightTime) return rightTime - leftTime;
      return String(right?.id || '').localeCompare(String(left?.id || ''));
    }
    function shanghaiDateKey(value) {
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      const parts = new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(date);
      const values = Object.fromEntries(parts.filter((part) => part.type !== 'literal').map((part) => [part.type, part.value]));
      return values.year + '-' + values.month + '-' + values.day;
    }
    function renderRuntimeLog(log) {
      const status = formatRuntimeStatus(log.status);
      const accountLabel = escapeHTML(log.account_label || log.account_id || '未知账号');
      const windowLabel = formatRuntimeWindow(log.window_id);
      const details = [];
      if (log.prize_label) details.push(`奖品：${escapeHTML(log.prize_label)}`);
      if (log.quota_delta_usd && typeof log.quota_delta_usd === 'object') details.push(`额度：${formatMoney(log.quota_delta_usd)}`);
      const detailText = details.length ? ` · ${details.join(' · ')}` : '';
      const statusClass = status.tone === 'ok' ? ' runtime-log__status--ok' : status.tone === 'error' ? ' runtime-log__status--error' : '';
      return `<article class="runtime-log"><div class="runtime-log__top"><div class="runtime-log__time">${escapeHTML(formatTime(log.occurred_at) || '时间未知')}</div><span class="runtime-log__status${statusClass}">${status.label}</span></div><div class="runtime-log__meta"><span>账号：${accountLabel}</span><span>窗口：${windowLabel}</span></div><div class="runtime-log__message">${escapeHTML(log.message || '无附加说明')}${detailText}</div></article>`;
    }
    function renderRuntimeLogs() {
      logsRefreshButton.disabled = state.logsLoading;
      logsRefreshButton.innerHTML = `${icons.refresh}<span>${state.logsLoading ? '刷新中' : '刷新日志'}</span>`;
      logsRoot.setAttribute('aria-busy', state.logsLoading ? 'true' : 'false');
      if (state.logsLoading && !state.runtimeLogs.length) {
        logsRoot.innerHTML = '<div class="runtime-state">正在读取运行日志...</div>';
        return;
      }
      if (state.logsError && !state.runtimeLogs.length) {
        logsRoot.innerHTML = `<div class="runtime-state runtime-state--error">运行日志拉取失败：${escapeHTML(state.logsError)}</div>`;
        return;
      }
      if (!state.runtimeLogs.length) {
        logsRoot.innerHTML = '<div class="runtime-state">暂无运行日志。</div>';
        return;
      }
      const items = state.runtimeLogs.slice().sort(compareRuntimeLogs).map(renderRuntimeLog).join('');
      const note = state.logsError ? `<div class="runtime-state runtime-state--error">最近一次刷新失败：${escapeHTML(state.logsError)}</div>` : '';
      logsRoot.innerHTML = `${note}${items}`;
    }
    const unsafeMethods = new Set(['POST', 'PATCH', 'PUT', 'DELETE']);
    function csrfToken() {
      const match = document.cookie.match(/(?:^|;\s*)workbench_csrf=([^;]*)/);
      if (!match) return '';
      try {
        return decodeURIComponent(match[1]);
      } catch (_) {
        return '';

    async function queryTokenUsage(id) {
      const account = findAccount(id);
      if (!account || account.querying_token_usage) return;
      account.querying_token_usage = true;
      render();
      try {
        account.token_usage_result = await request(`/api/accounts/${encodeURIComponent(id)}/token-usage`, { method: 'POST' });
        account.token_usage_error = '';
      } catch (error) {
        account.token_usage_error = error.message;
      } finally {
        account.querying_token_usage = false;
        render();
        focusStatus(account.id);
      }
    }
    function syncScheduleDialogFields() {
      const kind = document.querySelector('#schedule-dialog-kind');
      const end = document.querySelector('#schedule-dialog-end');
      const endLabel = document.querySelector('#schedule-dialog-end-label');
      const help = document.querySelector('#schedule-dialog-help');
      const random = kind?.value === 'random';
      if (end) { end.disabled = !random; end.required = random; if (!random) end.value = ''; }
      if (endLabel) endLabel.setAttribute('aria-hidden', random ? 'false' : 'true');
      if (help) help.textContent = random ? '每天在这个时间段内随机执行一次。' : '每天在指定时间执行一次。';
    }
    function openScheduleDialog(account) {
      if (!account) return;
      scheduleDialog.dataset.accountId = account.id;
      document.querySelector('#schedule-dialog-account').textContent = account.label || account.id;
      document.querySelector('#schedule-dialog-kind').value = 'fixed';
      document.querySelector('#schedule-dialog-task').value = 'draw';
      document.querySelector('#schedule-dialog-start').value = '';
      document.querySelector('#schedule-dialog-end').value = '';
      document.querySelector('#schedule-dialog-error').textContent = '';
      document.querySelector('#schedule-dialog-submit').disabled = false;
      syncScheduleDialogFields();
      openDialog(scheduleDialog);
      document.querySelector('#schedule-dialog-start').focus();
    }
    async function scheduleAdd(id) {
      const account = findAccount(id);
      if (!account || account.saving_schedule) return;
      const kind = document.querySelector('#schedule-dialog-kind').value;
      const taskType = document.querySelector('#schedule-dialog-task').value;
      const start = document.querySelector('#schedule-dialog-start').value;
      const end = document.querySelector('#schedule-dialog-end').value;
      const errorNode = document.querySelector('#schedule-dialog-error');
      if (!start) { errorNode.textContent = '请选择开始时间'; return; }
      if (kind === 'random' && (!end || end <= start)) { errorNode.textContent = '时段随机需要设置晚于开始时间的结束时间'; return; }
      const entry = kind === 'random' ? { kind, start, end, task_type: taskType, enabled: true } : { kind, start, task_type: taskType, enabled: true };
      const existing = scheduleEntries(account).map(({ id: entryID, kind: entryKind, start: entryStart, end: entryEnd, task_type: existingTaskType, enabled: existingEnabled }) => ({ id: entryID, kind: entryKind, start: entryStart, end: entryEnd, task_type: existingTaskType || 'draw', enabled: existingEnabled !== false }));
      account.saving_schedule = true;
      errorNode.textContent = '';
      document.querySelector('#schedule-dialog-submit').disabled = true;
      document.querySelector('#schedule-dialog-submit').textContent = '保存中';
      try {
        const payload = await request(`/api/accounts/${encodeURIComponent(id)}/auto-tasks`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ schedules: [...existing, entry] }),
        });
        account.draw_schedules = payload.tasks || payload.schedules || [];
        account.auto_tasks = account.draw_schedules;
        invalidateCachedRequests('/api/auto-draw-status');
        setFooter(account, '自动任务已保存', 'ok');
        closeDialog(scheduleDialog);
      } catch (error) {
        setFooter(account, `自动任务保存失败：${error.message}`, 'error');
        errorNode.textContent = error.message;
      } finally {
        account.saving_schedule = false;
        document.querySelector('#schedule-dialog-submit').disabled = false;
        document.querySelector('#schedule-dialog-submit').textContent = '添加计划';
        render();
        await refreshAutoDrawStatus(true);
        focusStatus(account.id);
      }
    }
    async function scheduleRemove(id, scheduleID) {
      const account = findAccount(id);
      if (!account || account.saving_schedule) return;
      account.saving_schedule = true;
      render();
      try {
        const remaining = scheduleEntries(account)
          .filter((entry) => entry.id !== scheduleID)
          .map(({ id: entryID, kind: entryKind, start: entryStart, end: entryEnd, task_type: existingTaskType, enabled: existingEnabled }) => ({ id: entryID, kind: entryKind, start: entryStart, end: entryEnd, task_type: existingTaskType || 'draw', enabled: existingEnabled !== false }));
        const payload = await request(`/api/accounts/${encodeURIComponent(id)}/auto-tasks`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ schedules: remaining }),
        });
        account.draw_schedules = payload.tasks || payload.schedules || [];
        account.auto_tasks = account.draw_schedules;
        invalidateCachedRequests('/api/auto-draw-status');
        setFooter(account, '自动任务已更新', 'ok');
      } catch (error) {
        setFooter(account, `定时抽奖计划更新失败：${error.message}`, 'error');
      } finally {
        account.saving_schedule = false;
        render();
        await refreshAutoDrawStatus(true);
        focusStatus(account.id);
      }
    }
    async function queryDrawCount(id) {
      const account = findAccount(id);
      if (!account || account.querying_draw) return;
      account.querying_draw = true;
      render();
      try {
        await refreshDrawCountOnly(account);
      } finally {
        account.querying_draw = false;
        render();
      }
    }
    async function toggleAutoTask(id, taskID, enabled, button) {
      const account = findAccount(id);
      if (!account || account.saving_schedule) return;
      account.saving_schedule = true;
      if (button) button.disabled = true;
      try {
        const payload = await request(`/api/accounts/${encodeURIComponent(id)}/auto-tasks/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task_id: taskID, enabled }),
        });
        account.draw_schedules = payload.tasks || [];
        account.auto_tasks = account.draw_schedules;
        invalidateCachedRequests('/api/auto-draw-status');
        setFooter(account, enabled ? '自动任务已启用' : '自动任务已停用', 'ok');
      } catch (error) {
        setFooter(account, `自动任务切换失败：${error.message}`, 'error');
      } finally {
        account.saving_schedule = false;
        render();
        await refreshAutoDrawStatus(true);
      }
    }
    root.addEventListener('click', async (event) => {
      const manage = event.target.closest('[data-add-account],[data-edit-account],[data-validate-auth],[data-reauthenticate],[data-session-preview],[data-delete-account]');
      if (manage) { handleManagementAction(manage); return; }
      const taskToggle = event.target.closest('[data-task-toggle]');
      if (taskToggle) {
        toggleAutoTask(taskToggle.dataset.taskToggle, taskToggle.dataset.taskId, taskToggle.dataset.enabled === 'true', taskToggle);
        return;
      }
      const schedule = event.target.closest('[data-schedule-remove]');
      if (schedule) {
        scheduleRemove(schedule.dataset.scheduleRemove, schedule.dataset.scheduleId);
        return;
      }
      const scheduleFocus = event.target.closest('[data-focus-schedule]');
      if (scheduleFocus) {
        openScheduleDialog(findAccount(scheduleFocus.dataset.focusSchedule));
        return;
      }
      const historyRefresh = event.target.closest('[data-draw-history-refresh]');
      if (historyRefresh) {
        const account = findAccount(historyRefresh.dataset.drawHistoryRefresh);
        if (account) {
          await refreshDrawHistoryOnly(account);
          await loadRuntimeLogs(true);
        }
        return;
      }
      const button = event.target.closest('[data-refresh],[data-checkin],[data-claim],[data-draw],[data-draw-count],[data-activity],[data-balance],[data-token-usage],[data-purchase-draw],[data-unlock-pass]');
      if (!button) return;
      if (button.dataset.refresh) refreshAccount(button.dataset.refresh);
      else if (button.dataset.checkin) checkinAccount(button.dataset.checkin);
      else if (button.dataset.claim) claimAccount(button.dataset.claim);
      else if (button.dataset.draw) drawAccount(button.dataset.draw);
      else if (button.dataset.drawCount) queryDrawCount(button.dataset.drawCount);
      else if (button.dataset.activity) queryActivity(button.dataset.activity);
      else if (button.dataset.balance) balanceAccount(button.dataset.balance);
      else if (button.dataset.tokenUsage) queryTokenUsage(button.dataset.tokenUsage);
      else if (button.dataset.purchaseDraw) purchaseDraw(button.dataset.purchaseDraw);
      else if (button.dataset.unlockPass) unlockPass(button.dataset.unlockPass);
    });
    logsRefreshButton.addEventListener('click', () => {
      if (!state.logsLoading) loadRuntimeLogs(false, true);
    });
    function renderSessionPreview(preview) {
      if (!preview) return '<div class="preview-state">会话预览不可用。</div>';
      if (preview.capability === 'unsupported') {
        return '<div class="preview-state">远端会话管理不可用：平台会话接口尚未确认。</div>';
      }
      const accountID = previewDialog.dataset.accountId;
      const rows = (preview.sessions || []).map((item) => {
        const badge = item.current ? '当前会话' : item.workbench_owned ? '工作台' : '其他设备';
        const line1 = [escapeHTML(item.device || '未知设备'), item.ip ? escapeHTML(item.ip) : '', item.login_method ? escapeHTML(item.login_method) : ''].filter(Boolean).join(' · ');
        const line2 = [`SID ${escapeHTML(item.sid || '')}`, item.created_at ? `登录于 ${formatTime(item.created_at)}` : '', item.last_active_at ? `活跃 ${formatTime(item.last_active_at)}` : '', item.expires_at ? `过期 ${formatTime(item.expires_at)}` : ''].filter(Boolean).join(' · ');
        return `<li class="sess-row"><div class="sess-row__head"><span class="sess-badge${item.current ? ' sess-badge--current' : ''}">${escapeHTML(badge)}</span><span class="sess-device">${line1}</span><button class="action action--compact action--danger" type="button" data-session-revoke="${escapeHTML(accountID)}" data-sid="${escapeHTML(item.sid || '')}" data-current="${item.current ? '1' : '0'}">撤销</button></div><div class="sess-row__meta">${line2}</div></li>`;
      }).join('');
      const list = rows ? `<ul class="preview-sessions">${rows}</ul>` : '<p class="auto-draw__empty">当前没有在线会话。</p>';
      return `<div class="preview-state">平台共 ${toNumber(preview.total_known)} 个会话。撤销当前会话后需要重新认证；其他会话撤销后对应设备将退出登录。</div><div class="account-dialog__row account-dialog__row--start"><button class="action action--danger" type="button" data-session-revoke-others>退出其他所有会话</button></div>${list}`;
    }
    function openDialog(dialog) { if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open', ''); }
    function closeDialog(dialog) { dialog.close ? dialog.close() : dialog.removeAttribute('open'); }
    const accountDialog = document.querySelector('#account-dialog');
    const scheduleDialog = document.querySelector('#schedule-dialog');
    const reauthDialog = document.querySelector('#reauth-dialog');
    const previewDialog = document.querySelector('#preview-dialog');
    const deleteDialog = document.querySelector('#delete-dialog');
    let editTargetId = null;
    function openAccountDialog(account) {
      editTargetId = account ? account.id : null;
      document.querySelector('#account-dialog-title').textContent = account ? '编辑账号' : '新增账号';
      document.querySelector('#account-dialog-label').value = account ? (account.label || '') : '';
      document.querySelector('#account-dialog-login').value = '';
      document.querySelector('#account-dialog-password').value = '';
      openDialog(accountDialog);
      document.querySelector('#account-dialog-label').focus();
    }
    async function submitAccountDialog(event) {
      event.preventDefault();
      const label = document.querySelector('#account-dialog-label').value.trim();
      const loginName = document.querySelector('#account-dialog-login').value.trim();
      const password = document.querySelector('#account-dialog-password').value;
      const errorNode = document.querySelector('#account-dialog-error');
      errorNode.textContent = '';
      try {
        if (editTargetId) {
          const payload = { label };
          if (loginName) payload.login_name = loginName;
          if (password) payload.password = password;
          await request(`/api/accounts/${encodeURIComponent(editTargetId)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        } else {
          await request('/api/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ label, login_name: loginName, password }) });
        }
        document.querySelector('#account-dialog-password').value = '';
        closeDialog(accountDialog);
        await loadAccounts();
      } catch (error) {
        errorNode.textContent = error.message;
      }
    }
    async function submitReauthenticate(accountID) {
      const errorNode = document.querySelector('#reauth-dialog-error');
      errorNode.textContent = '';
      try {
        await request(`/api/accounts/${encodeURIComponent(accountID)}/reauthenticate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true }) });
        closeDialog(reauthDialog);
        await loadAccounts();
      } catch (error) {
        errorNode.textContent = error.message;
      }
    }
    async function submitDelete(accountID) {
      const errorNode = document.querySelector('#delete-dialog-error');
      errorNode.textContent = '';
      try {
        await request(`/api/accounts/${encodeURIComponent(accountID)}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirmation: 'DELETE' }) });
        closeDialog(deleteDialog);
        if (state.activeAccountId === accountID) state.activeAccountId = null;
        await loadAccounts();
      } catch (error) {
        errorNode.textContent = error.message;
      }
    }
    accountDialog.addEventListener('submit', submitAccountDialog);
    document.querySelector('#account-dialog-cancel').addEventListener('click', () => { document.querySelector('#account-dialog-password').value = ''; closeDialog(accountDialog); });
    document.querySelector('#schedule-dialog-kind').addEventListener('change', syncScheduleDialogFields);
    scheduleDialog.addEventListener('submit', (event) => { event.preventDefault(); scheduleAdd(scheduleDialog.dataset.accountId); });
    document.querySelector('#schedule-dialog-cancel').addEventListener('click', () => closeDialog(scheduleDialog));
    reauthDialog.addEventListener('submit', (event) => { event.preventDefault(); submitReauthenticate(reauthDialog.dataset.accountId); });
    document.querySelector('#reauth-dialog-cancel').addEventListener('click', () => closeDialog(reauthDialog));
    deleteDialog.addEventListener('submit', (event) => { event.preventDefault(); submitDelete(deleteDialog.dataset.accountId); });
    document.querySelector('#delete-dialog-cancel').addEventListener('click', () => closeDialog(deleteDialog));
    document.querySelector('#preview-dialog-close').addEventListener('click', () => closeDialog(previewDialog));
    previewDialog.addEventListener('click', async (event) => {
      const othersButton = event.target.closest('[data-session-revoke-others]');
      const revokeButton = event.target.closest('[data-session-revoke]');
      if (!othersButton && !revokeButton) return;
      const accountID = previewDialog.dataset.accountId;
      const account = findAccount(accountID);
      const errorNode = document.querySelector('#preview-dialog-error');
      errorNode.textContent = '';
      if (othersButton) {
        if (!window.confirm('将退出除当前会话外的所有设备，确定继续？')) return;
        othersButton.disabled = true;
        try {
          const result = await request(`/api/accounts/${encodeURIComponent(accountID)}/sessions/revoke-others`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true }) });
          errorNode.textContent = `已退出 ${result.revoked.length} 个其他会话`;
          const payload = await request(`/api/accounts/${encodeURIComponent(accountID)}/session-preview`);
          document.querySelector('#preview-dialog-body').innerHTML = renderSessionPreview(payload.preview);
        } catch (error) {
          errorNode.textContent = error.message;
          othersButton.disabled = false;
        }
        return;
      }
      const sid = revokeButton.dataset.sid;
      if (revokeButton.dataset.current === '1') {
        if (!window.confirm('这是当前会话，撤销后工作台需要重新认证才能继续操作。确定撤销？')) return;
      } else if (!window.confirm('确定撤销该会话？对应设备将退出登录。')) {
        return;
      }
      revokeButton.disabled = true;
      try {
        const result = await request(`/api/accounts/${encodeURIComponent(accountID)}/sessions/revoke`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sid }) });
        if (result.current_revoked) {
          if (account) account.auth_health = 'needs_reauth';
          closeDialog(previewDialog);
          setFooter(account, '当前会话已撤销，请重新认证后继续', 'error');
          render();
          return;
        }
        const payload = await request(`/api/accounts/${encodeURIComponent(accountID)}/session-preview`);
        document.querySelector('#preview-dialog-body').innerHTML = renderSessionPreview(payload.preview);
      } catch (error) {
        errorNode.textContent = error.message;
        revokeButton.disabled = false;
      }
    });
    function handleManagementAction(button) {
      if (button.hasAttribute('data-add-account')) { openAccountDialog(null); return; }
      const accountID = button.dataset.editAccount || button.dataset.validateAuth || button.dataset.reauthenticate || button.dataset.sessionPreview || button.dataset.deleteAccount;
      if (!accountID) return;
      const account = findAccount(accountID);
      if (button.dataset.editAccount) openAccountDialog(account);
      else if (button.dataset.validateAuth) request(`/api/accounts/${encodeURIComponent(accountID)}/validate`, { method: 'POST' }).then(async (result) => { account.auth_health = result.auth_health; render(); }).catch(async (error) => { setFooter(account, `认证检查失败：${error.message}`, 'error'); render(); });
      else if (button.dataset.reauthenticate) { reauthDialog.dataset.accountId = accountID; document.querySelector('#reauth-dialog-account').textContent = account?.label || accountID; document.querySelector('#reauth-dialog-error').textContent = ''; openDialog(reauthDialog); }
      else if (button.dataset.sessionPreview) { previewDialog.dataset.accountId = accountID; document.querySelector('#preview-dialog-body').innerHTML = '<div class="preview-state">正在读取会话列表...</div>'; document.querySelector('#preview-dialog-error').textContent = ''; openDialog(previewDialog); request(`/api/accounts/${encodeURIComponent(accountID)}/session-preview`).then((payload) => { document.querySelector('#preview-dialog-body').innerHTML = renderSessionPreview(payload.preview); }).catch((error) => { closeDialog(previewDialog); setFooter(account, `会话预览失败：${error.message}`, 'error'); render(); }); }
      else if (button.dataset.deleteAccount) { deleteDialog.dataset.accountId = accountID; document.querySelector('#delete-dialog-account').textContent = account?.label || accountID; document.querySelector('#delete-dialog-error').textContent = ''; openDialog(deleteDialog); }
    }
    tabsRoot.addEventListener('click', (event) => {
      const add = event.target.closest('[data-add-account]');
      if (add) { openAccountDialog(null); return; }
      const tab = event.target.closest('[data-tab]');
      if (!tab) return;
      const id = tab.dataset.tab;
      if (id === state.activeAccountId) { tab.focus({ preventScroll: true }); return; }
      state.activeAccountId = id;
      render();
      tabsRoot.querySelector('.account-tab[aria-selected="true"]')?.focus({ preventScroll: true });
    });
    logoutButton.addEventListener('click', async () => {
      if (logoutButton.disabled) return;
      logoutButton.disabled = true;
      logoutButton.textContent = '退出中';
      logoutError.textContent = '';
      logoutError.classList.remove('page-note--error');
      try {
        await request('/api/admin/logout', { method: 'POST' });
      } catch (error) {
        if (!error.loginRequired) {
          logoutButton.disabled = false;
          logoutButton.textContent = '退出登录';
          logoutError.textContent = error.message || '退出失败，请稍后重试';
          logoutError.classList.add('page-note--error');
          return;
        }
      }
      window.location.replace('/login?next=%2F');
    });
    async function loadAccounts() {
      const payload = await request('/api/bootstrap');
      const previous = state.activeAccountId;
      state.accounts = Array.isArray(payload?.accounts) ? payload.accounts.map(hydrateAccount) : [];
      state.activeAccountId = state.accounts.some((item) => item.id === previous) ? previous : (state.accounts[0]?.id || null);
      state.runtimeLogs = Array.isArray(payload?.logs) ? payload.logs : [];
      render();
    }
    renderRuntimeLogs();
    loadAccounts().catch((error) => {
      root.innerHTML = `<p class="page-message">${escapeHTML(error.message)}</p>`;
    });
    loadRuntimeLogs();
    window.setInterval(() => {
      if (document.visibilityState === 'hidden') return;
      refreshAutoDrawStatus();
      loadRuntimeLogs();
    }, 30000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        refreshAutoDrawStatus();
        loadRuntimeLogs();
      }
    });
  </script>
  <div style="position:fixed;right:12px;bottom:10px;font-size:12px;opacity:.4;user-select:none;pointer-events:none">__APP_VERSION__</div>
</body>
</html>
